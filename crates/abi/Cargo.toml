[package]
name         = "tronz-abi"
description  = "TRON contract ABI metadata types and optional Alloy JSON ABI conversion."
keywords     = ["tron", "blockchain", "abi", "solidity", "smart-contracts"]
categories   = ["cryptography::cryptocurrencies", "data-structures"]
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "-Zunstable-options", "--generate-link-to-definition", "--show-type-layout"]

[dependencies]
alloy-json-abi = { workspace = true, optional = true }
serde          = { workspace = true, optional = true }
thiserror      = { workspace = true, optional = true }

[features]
default = []
## Conversion to and from Alloy's `JsonAbi`, plus `TronAbiConversionError`.
alloy = ["dep:alloy-json-abi", "dep:thiserror"]
## Serialization of the native TRON ABI data model.
serde = ["dep:serde"]

[dev-dependencies]
serde_json = { workspace = true }
