[package]
name         = "tronz-provider"
description  = "gRPC transports and high-level providers for the tronz SDK."
keywords     = ["tron", "blockchain", "grpc", "cryptocurrency", "provider"]
categories   = ["cryptography::cryptocurrencies", "network-programming", "api-bindings", "asynchronous"]
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "-Zunstable-options", "--generate-link-to-definition", "--show-type-layout"]

[dependencies]
async-trait      = { workspace = true }
auto_impl        = { workspace = true }
tronz-primitives = { workspace = true }
tronz-signer     = { workspace = true }
tronz-rpc-types  = { workspace = true }

prost       = { workspace = true }
tonic       = { workspace = true }
tonic-prost = { workspace = true }
futures     = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
thiserror   = { workspace = true }
fastrand    = { workspace = true }

[features]
default = ["grpc-tls"]
# gRPC transport with TLS (connects to TronGrid grpc.trongrid.io:443)
grpc-tls = ["tonic/tls-native-roots"]
# gRPC without TLS (plain HTTP/2, local nodes)
grpc = []
# In-memory `MockTransport` for testing without a live node.
mock = []

[dev-dependencies]
tronz-primitives = { workspace = true }
tronz-rpc-types  = { workspace = true, features = ["test-utils"] }
# A test helper builds a `transaction::Contract`, whose `parameter` is an `Any`.
prost-types = { workspace = true }
tronz-signer     = { workspace = true }
tronz-provider-test-support = { path = "tests/support" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
tonic = { workspace = true }
