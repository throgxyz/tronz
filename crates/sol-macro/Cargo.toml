[package]
name         = "tronz-sol-macro"
description  = "The `tron_sol!` procedural macro for the tronz TRON SDK — generates provider-bound, type-safe contract bindings from Solidity."
keywords     = ["tron", "blockchain", "smart-contracts", "abi", "macro"]
categories   = ["cryptography::cryptocurrencies", "api-bindings"]
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "-Zunstable-options", "--generate-link-to-definition", "--show-type-layout"]

[lib]
proc-macro = true

[dependencies]
syn          = { workspace = true }
syn-solidity = { workspace = true }
quote        = { workspace = true }
proc-macro2  = { workspace = true }
alloy-json-abi = { workspace = true, features = ["serde_json"] }
