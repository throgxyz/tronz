[package]
name         = "tronz-signer"
description  = "Signing traits and local key signer for the tronz TRON SDK."
keywords     = ["tron", "blockchain", "cryptocurrency", "signer", "secp256k1"]
categories   = ["cryptography::cryptocurrencies", "network-programming", "api-bindings", "asynchronous"]
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }

[features]
## TIP-712 typed-data signing via `sign_typed_data` / `sign_dynamic_typed_data`.
eip712 = ["dep:alloy-dyn-abi", "dep:alloy-sol-types"]
## Random private key generation via `LocalSigner::random`.
rand = ["dep:rand"]
## BIP-39 mnemonic + BIP-44 HD key derivation via `MnemonicBuilder`.
mnemonic = ["dep:coins-bip32", "dep:coins-bip39", "rand"]
## Web3 Secret Storage V3 keystore encrypt/decrypt.
keystore = ["dep:scrypt", "dep:pbkdf2", "dep:sha2", "dep:aes", "dep:ctr", "dep:sha3", "dep:uuid", "dep:serde", "dep:serde_json", "rand"]

[dependencies]
tronz-primitives = { workspace = true }
async-trait      = { workspace = true }
auto_impl        = { workspace = true }
k256             = { workspace = true }
hex              = { workspace = true }
thiserror        = { workspace = true }

# eip712 feature
alloy-dyn-abi   = { workspace = true, optional = true, features = ["eip712"] }
alloy-sol-types = { workspace = true, optional = true }

# mnemonic feature
coins-bip32 = { workspace = true, optional = true }
coins-bip39 = { workspace = true, optional = true }
rand        = { workspace = true, optional = true }

# keystore feature
scrypt     = { workspace = true, optional = true }
pbkdf2     = { workspace = true, optional = true }
sha2       = { workspace = true, optional = true }
aes        = { workspace = true, optional = true }
ctr        = { workspace = true, optional = true }
sha3       = { workspace = true, optional = true }
uuid       = { workspace = true, optional = true }
serde      = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
alloy-primitives = { workspace = true }
serde_json       = { workspace = true }
tokio            = { workspace = true, features = ["rt", "macros"] }
tempfile         = "3"
