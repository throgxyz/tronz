version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    cooldown:
      default-days: 7
    groups:
      ci-weekly:
        patterns:
          - '*'
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: rand
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: syn
        update-types:
          - version-update:semver-major
    groups:
      cargo-weekly:
        patterns:
          - '*'
