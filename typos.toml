[files]
# The TRON protocol buffer definitions are third-party, and so are the field names
# generated from them — `latest_opration_time` and `Sucess` are spelled that way
# on the wire.
extend-exclude = ["crates/rpc-types/proto/**", "**/generated/**"]

[default.extend-words]
# TRON-specific abbreviations that typos would otherwise flag.
tronz = "tronz"
nile = "nile"
trx = "trx"
sun = "sun"
# TronBox Runtime Environment.
tre = "tre"
# Part of TRE's deterministic recipient Base58 address.
yuo = "yuo"
# Proto-generated names.
extention = "extention"   # TRON proto uses "TransactionExtention" (sic)
# "ot" appears in the well-known TRON base58 address TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t
# and is not a misspelling.
ot = "ot"
# "abd" appears in the EVM function selector 0x06661abd (count() on the Counter contract).
abd = "abd"
# "entrys" is the literal JSON field name in the ABI format returned by TRON nodes.
entrys = "entrys"
